<style>
/* Layout: uma coluna estreita de telemóvel, cabeçalho fixo com o SOS sempre à vista e barra de separadores em baixo. */
:root{
  --bg:#eef4f3; --surface:#ffffff; --surface-2:#e2ecea; --line:#cfdedb;
  --ink:#17302c; --ink-soft:#4b625e; --leaf:#257a6f; --leaf-strong:#1b5f56; --leaf-tint:#d5ebe7;
  --sos:#c4453b; --on-leaf:#ffffff; --on-sos:#ffffff; --sos-tint:#f8e3e0; --warn:#a86a12; --warn-tint:#f7ecd9;
  --m1:#c4584b; --m2:#d98b4e; --m3:#c9b14a; --m4:#6fae8e; --m5:#2f8f7f; --anx:#7c6bb0;
  --display:"Lexend", "Segoe UI", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(23,48,44,.06),0 4px 14px rgba(23,48,44,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1917; --surface:#162523; --surface-2:#1e302d; --line:#2a3f3c;
  --ink:#e3efec; --ink-soft:#a3b8b4; --leaf:#5cc0b0; --leaf-strong:#86d6c8; --leaf-tint:#1d3a36;
  --sos:#ef7b70; --on-leaf:#0e1917; --on-sos:#1f0c0a; --sos-tint:#3a1f1c; --warn:#e2ad5a; --warn-tint:#352a17;
  --m1:#e27d70; --m2:#e8a26c; --m3:#d9c46a; --m4:#86c4a4; --m5:#5cc0b0; --anx:#a99ae0;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1917; --surface:#162523; --surface-2:#1e302d; --line:#2a3f3c;
  --ink:#e3efec; --ink-soft:#a3b8b4; --leaf:#5cc0b0; --leaf-strong:#86d6c8; --leaf-tint:#1d3a36;
  --sos:#ef7b70; --on-leaf:#0e1917; --on-sos:#1f0c0a; --sos-tint:#3a1f1c; --warn:#e2ad5a; --warn-tint:#352a17;
  --m1:#e27d70; --m2:#e8a26c; --m3:#d9c46a; --m4:#86c4a4; --m5:#5cc0b0; --anx:#a99ae0;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:1.55rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--leaf-strong)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px;border-radius:6px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-weight:600;font-size:1.1rem;display:block;line-height:1.1}
.brand small{color:var(--ink-soft);font-size:.78rem}
.sos-btn{background:var(--sos);color:var(--on-sos);border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-family:var(--display);letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px}
.sos-btn::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

/* principal */
main{padding-block:20px 120px}
main .wrap{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card.tint{background:var(--leaf-tint);box-shadow:none}
.card.alert{background:var(--sos-tint);box-shadow:none;border:1px solid var(--sos)}
.card.warn{background:var(--warn-tint);box-shadow:none}
.muted{color:var(--ink-soft)}
.small{font-size:.88rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 18px;min-height:46px;font-weight:700;cursor:pointer;background:var(--leaf);color:var(--on-leaf);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.ghost{background:transparent;color:var(--leaf-strong);border:1.5px solid var(--line)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--sos);color:var(--on-sos)}
.btn.block{width:100%}
.btn.big{min-height:60px;font-size:1.08rem;border-radius:16px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.92rem;min-height:38px}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--surface);font-weight:700}
label{font-weight:700;font-size:.95rem}
.hint{font-weight:400;color:var(--ink-soft);font-size:.86rem;display:block}
input[type=text],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:11px 12px;min-height:46px}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--leaf)}
.field{display:flex;flex-direction:column;gap:6px}

/* grelha de atalhos */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile b{font-family:var(--display);font-weight:500}
.tile span{color:var(--ink-soft);font-size:.86rem;line-height:1.35}
.tile .ico{width:28px;height:28px;color:var(--leaf)}

/* caras do humor */
.faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.face{border:2px solid transparent;background:transparent;border-radius:14px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.74rem;color:var(--ink-soft)}
.face svg{width:44px;height:44px}
.face[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-tint);color:var(--ink);font-weight:700}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;cursor:pointer;font-weight:700}
.scale button[aria-pressed="true"]{background:var(--anx);border-color:var(--anx);color:var(--surface)}

/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:4px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink-soft);font-size:.72rem;padding:6px 0;border-radius:10px;min-height:52px;justify-content:center}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--leaf-strong);font-weight:700;background:var(--leaf-tint)}

/* respiração */
.breath{display:grid;place-items:center;height:290px;position:relative}
.breath .ring{position:absolute;width:250px;height:250px;border-radius:50%;border:2px dashed var(--line)}
.breath .ball{width:250px;height:250px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--leaf-tint),var(--leaf));transform:scale(.45);transition-property:transform;transition-timing-function:ease-in-out;display:grid;place-items:center}
.breath .label{position:absolute;text-align:center;pointer-events:none}
.breath .label b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:500}
.breath .label span{font-size:2.2rem;font-family:var(--display);font-variant-numeric:tabular-nums}

/* sobreposições */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,20,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--surface-2);border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:1.3rem;flex:none}
.line{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.line .num{font-family:var(--display);font-size:1.45rem;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;user-select:all}
.line .who{font-weight:700}
.line .when{font-size:.85rem;color:var(--ink-soft)}
.line .acts{display:flex;gap:8px;flex-wrap:wrap}
.line.urgent{border:2px solid var(--sos)}
.call{background:var(--sos);color:var(--on-sos);border-radius:12px;padding:10px 16px;font-weight:700;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.copy{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}

/* listas e histórico */
.entry{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.entry:first-of-type{border-top:0;padding-top:0}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:1.3rem;color:var(--leaf)}
details[open] summary::after{content:"–"}
.check{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:24px;height:24px;accent-color:var(--leaf);flex:none;margin-top:2px}
.check.done .t{text-decoration:line-through;color:var(--ink-soft)}
.del{border:0;background:transparent;color:var(--ink-soft);cursor:pointer;margin-left:auto;padding:4px 8px;font-size:1.1rem}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;background:var(--surface-2)}
.pill.ok{background:var(--leaf-tint);color:var(--leaf-strong)}
.pill.mid{background:var(--warn-tint);color:var(--warn)}
.pill.hi{background:var(--sos-tint);color:var(--sos)}
.q{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.opts button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;min-height:44px;cursor:pointer;font-size:.88rem;line-height:1.25}
.opts button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--surface);font-weight:700}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--ink-soft);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.timer{font-family:var(--display);font-size:3.4rem;font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.medorb{width:88px;height:88px;border-radius:50%;margin:0 auto;background:radial-gradient(circle at 35% 35%,var(--leaf-tint),var(--leaf));animation:orb 10s ease-in-out infinite}
@keyframes orb{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.08);opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60;font-weight:700;font-size:.92rem;max-width:90%}
.step-n{font-family:var(--display);font-size:3rem;color:var(--leaf);line-height:1}
.foot{text-align:center;font-size:.82rem;color:var(--ink-soft);padding-top:8px}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: reduce){.sos-btn::before,.medorb{animation:none}.breath .ball{transition-duration:0s!important}}
@media (min-width:520px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

<script>
(function(){
"use strict";
/* ---------- dados guardados só neste dispositivo ---------- */
var KEY="menteleve.v1";
var mem=null;
function blank(){return {moods:[],thoughts:[],gratitude:[],tasks:{},plan:{},screens:[],projects:[],meds:[],onboarded:false}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);var b=blank();for(var k in b){if(!(k in d))d[k]=b[k]}return d}}catch(e){}return blank()}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=S}}

/* ---------- utilitários ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function dayKey(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
var MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function fmtDate(iso){var d=new Date(iso);return d.getDate()+" "+MESES[d.getMonth()]+" · "+pad(d.getHours())+":"+pad(d.getMinutes())}
function fmtDay(k){var p=k.split("-");return +p[2]+" "+MESES[+p[1]-1]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var toastT;
function toast(msg){var t=$(".toast");if(t)t.remove();t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(function(){t.remove()},2400)}
function copyText(txt,btn){
  function ok(){toast("Número copiado: "+txt)}
  try{navigator.clipboard.writeText(txt).then(ok,function(){sel(btn)})}catch(e){sel(btn)}
  function sel(b){var n=b&&b.parentNode&&b.parentNode.parentNode.querySelector(".num");if(n){var r=document.createRange();r.selectNodeContents(n);var s=getSelection();s.removeAllRanges();s.addRange(r);toast("Número selecionado")}}
}
function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
var actx;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,0.35,0.7].forEach(function(t){var o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=660;g.gain.setValueAtTime(0.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.25,actx.currentTime+t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+t+0.3);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+0.32)})}catch(e){}}

/* ---------- contactos de ajuda (verificados em nov. 2026) ---------- */
var LINES=[
  {n:"112",tel:"112",who:"Emergência",when:"24 horas · gratuito",what:"Se estás em perigo imediato, se te magoaste ou se alguém corre risco de vida.",urgent:true},
  {n:"1411",tel:"1411",who:"Linha de Prevenção do Suicídio e Apoio Psicológico (SNS 24)",when:"24 horas · gratuita e confidencial",what:"Psicólogos e enfermeiros especialistas. Para pensamentos de suicídio ou crise emocional.",urgent:true},
  {n:"808 24 24 24",tel:"808242424",who:"SNS 24 · Aconselhamento psicológico",when:"24 horas · escolhe a opção 4",what:"Apoio psicológico e orientação para o serviço de saúde certo."},
  {n:"213 544 545",tel:"213544545",who:"SOS Voz Amiga",when:"Todos os dias, 15h30–00h30",what:"Voluntários que ouvem, sem julgar. Também: 912 802 669 · 963 524 660."},
  {n:"116 111",tel:"116111",who:"SOS Criança e Jovem (IAC)",when:"Gratuita e confidencial",what:"Para crianças e jovens. Também por chat e e-mail em iacrianca.pt."}

function chart(days){
  var W=340,H=150,L=30,R=8,T=10,B=24;
  var today=new Date();today.setHours(0,0,0,0);
  var pts=[],apts=[];
  for(var i=days-1;i>=0;i--){
    var d=new Date(today);d.setDate(d.getDate()-i);var k=dayKey(d);
    var es=S.moods.filter(function(x){return x.day===k});
    var x=L+(W-L-R)*((days-1-i)/(days-1));
    if(es.length){var avg=es.reduce(function(s,e){return s+e.mood},0)/es.length;pts.push([x,avg]);
      var an=es.filter(function(e){return e.anx});if(an.length){apts.push([x,an.reduce(function(s,e){return s+e.anx},0)/an.length])}}
  }
  function y(v){return T+(H-T-B)*(1-(v-1)/4)}
  var g='';
  for(var v=1;v<=5;v++){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" font-size="10" text-anchor="end" fill="var(--ink-soft)">'+v+'</text>'}
  g+='<text x="'+L+'" y="'+(H-6)+'" font-size="10" fill="var(--ink-soft)">há '+(days-1)+' dias</text><text x="'+(W-R)+'" y="'+(H-6)+'" font-size="10" text-anchor="end" fill="var(--ink-soft)">hoje</text>';
  function path(a,col,dash){if(!a.length)return'';var d=a.map(function(p,i){return(i?"L":"M")+p[0].toFixed(1)+" "+y(p[1]).toFixed(1)}).join(" ");return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"'+(dash?' stroke-dasharray="5 4"':'')+'/>'+a.map(function(p,i){var last=i===a.length-1;return '<circle cx="'+p[0].toFixed(1)+'" cy="'+y(p[1]).toFixed(1)+'" r="'+(last?4.5:3)+'" fill="'+col+'"/>'}).join("")}
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico do humor nos últimos '+days+' dias">'+g+path(apts,"var(--anx)",true)+path(pts,"var(--leaf)")+'</svg><div class="legend"><span><i style="background:var(--leaf)"></i>Humor (1 = muito mal · 5 = muito bem)</span><span><i style="background:var(--anx)"></i>Ansiedade (1–5)</span></div>';
}

var POMO={mode:"foco",len:{foco:25,pausa:5},endAt:0,left:25*60,running:false,count:0,iv:0};
function pomoTick(){
  if(!POMO.running)return;
  POMO.left=Math.max(0,Math.round((POMO.endAt-Date.now())/1000));
  if(POMO.left<=0){
    POMO.running=false;clearInterval(POMO.iv);beep();vibrate([300,150,300]);
    if(POMO.mode==="foco"){POMO.count++;POMO.mode="pausa";toast("Bom trabalho! Hora de uma pausa.")}else{POMO.mode="foco";toast("Pausa terminada. Pronto/a para mais um bloco?")}
    POMO.left=POMO.len[POMO.mode]*60;
  }
  var t=$("#ptime");if(t)drawPomo();
}
function drawPomo(){
  var m=Math.floor(POMO.left/60),s=POMO.left%60;
  $("#ptime").textContent=pad(m)+":"+pad(s);
  $("#pmode").textContent=POMO.mode==="foco"?"Foco":"Pausa";
  $("#pgo").textContent=POMO.running?"Pausar":"Começar";
  $("#pcount").textContent="Blocos de foco hoje: "+POMO.count;
  var tot=POMO.len[POMO.mode]*60,f=1-POMO.left/tot,c=2*Math.PI*54;
  $("#parc").setAttribute("stroke-dashoffset",(c*(1-f)).toFixed(1));
  $("#parc").setAttribute("stroke",POMO.mode==="foco"?"var(--leaf)":"var(--anx)");
}

function medPlayer(el,key){
  var silent=key.indexOf("sil")===0,m;
  if(silent){var n=+key.slice(3);m={k:key,t:"Silêncio · "+n+" min",th:"Meditação em silêncio",l:[["Fica com a respiração. Quando a mente fugir, volta com gentileza.",n*60-4]]}}
  else m=MEDS.filter(function(x){return x.k===key})[0];
  if(!m){medSel=null;render();return}
  var total=0;m.l.forEach(function(x){total+=lineSecs(x[0])+x[1]});
  var idx=0,paused=false,token=0,timers=[],started=Date.now(),elapsed=0,lastTick=Date.now(),finished=false;
  el.innerHTML='<a href="#meditar" class="small" id="mback" style="text-decoration:none">‹ Meditar</a>'+
  '<p class="eyebrow">'+esc(m.th)+'</p><h1>'+esc(m.t)+'</h1>'+
  '<div class="card" style="min-height:300px;justify-content:space-between"><div class="medorb" aria-hidden="true"></div>'+
  '<p id="mtext" aria-live="polite" style="font-family:var(--display);font-size:1.3rem;line-height:1.45;text-align:center;min-height:6.5em;display:grid;place-items:center">A preparar…</p>'+
  '<div style="height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden"><div id="mbar" style="height:100%;width:0;background:var(--leaf);transition:width 1s linear"></div></div>'+
  '<div class="row" style="justify-content:space-between"><span class="small muted" id="mtime">0:00</span><span class="small muted">≈ '+Math.round(total/60)+' min</span></div>'+
  '<div class="row"><button class="btn big" style="flex:1" type="button" id="mpause">Pausar</button><button class="btn soft big" type="button" id="mstop">Terminar</button></div></div>'+
  '<p class="small muted" style="text-align:center">Dica: ativa o modo «Não incomodar» no telemóvel.</p>';
  function clear(){token++;timers.forEach(clearTimeout);timers=[];try{speechSynthesis.cancel()}catch(e){}}
  var iv=setInterval(function(){var now=Date.now();if(!paused&&!finished)elapsed+=(now-lastTick)/1000;lastTick=now;var e=Math.min(elapsed,total);$("#mbar")&&($("#mbar").style.width=(100*e/total).toFixed(1)+"%");$("#mtime")&&($("#mtime").textContent=Math.floor(e/60)+":"+pad(Math.floor(e%60)))},1000);
  function speak(text,cb){
    var my=++token,done=false;function fin(){if(done||my!==token)return;done=true;cb()}
    var est=lineSecs(text)*1000;
    if(med.voice&&"speechSynthesis" in window&&!silent){
      try{
        var parts=sentences(text),v=pickVoice(),pi=0;speechSynthesis.cancel();
        var say=function(){if(my!==token)return;if(pi>=parts.length){fin();return}
          var u=new SpeechSynthesisUtterance(parts[pi++]);if(v){u.voice=v;u.lang=v.lang}else u.lang="pt-PT";
          u.rate=med.rate;u.pitch=1.02;u.volume=0.9;
          var next=function(){if(my!==token)return;timers.push(setTimeout(say,pi<parts.length?850:0))};
          u.onend=next;u.onerror=next;speechSynthesis.speak(u)};
        say();timers.push(setTimeout(fin,est*2.5+5000))
      }catch(e){timers.push(setTimeout(fin,est))}
    }else timers.push(setTimeout(fin,silent?300:est));
  }
  function step(){
    if(paused||finished)return;
    if(idx>=m.l.length){finish(true);return}
    var ln=m.l[idx],mt=$("#mtext");if(!mt)return;mt.textContent=ln[0];
    speak(ln[0],function(){var my=token;timers.push(setTimeout(function(){if(my===token&&!paused){idx++;step()}},ln[1]*1000))});
  }
  function finish(full){
    if(finished)return;finished=true;clear();clearInterval(iv);
    var mins=Math.max(1,Math.round(elapsed/60));
    if(elapsed>=45){S.meds.push({id:uid(),at:new Date().toISOString(),k:m.k,mins:mins});save()}
    if(full&&!m.quiet)bell();
    setTimeout(function(){ambStop()},full?4000:0);wakeOff();
    el.innerHTML='<h1>'+(full?'Terminaste':'Fizeste uma pausa')+'</h1><div class="card tint"><p>'+(elapsed>=45?'Meditaste cerca de '+mins+' minuto'+(mins>1?'s':'')+'. ':'')+'Repara como está agora o teu corpo, sem julgar.</p></div>'+
    '<div class="row"><a class="btn" href="#humor">Registar como estou</a><button class="btn soft" type="button" id="mlib">Outras meditações</button></div>'+DISC;
    $("#mlib").addEventListener("click",function(){medSel=null;render()});
    medSel=null;
  }
  $("#mpause").addEventListener("click",function(){
    if(paused){paused=false;this.textContent="Pausar";ambStart(med.amb);wakeOn();step()}
    else{paused=true;token++;clear();this.textContent="Continuar";ambStop();$("#mtext").textContent="Em pausa. "+m.l[idx][0]}
  });
  $("#mstop").addEventListener("click",function(){finish(false)});
  $("#mback").addEventListener("click",function(e){e.preventDefault();medSel=null;render()});
  cleanup=function(){token++;clear();clearInterval(iv);ambStop();wakeOff();medSel=null};
  bell();ambStart(med.amb);wakeOn();
  timers.push(setTimeout(step,silent?1500:3500));
}

/* arranque */
window.addEventListener("hashchange",render);
render();
if(!S.onboarded)onboarding();
try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register("sw.js").catch(function(){})}}catch(e){}
})();
</script>
